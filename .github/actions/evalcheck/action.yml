name: EvalCheck notebook gate
description: Inspect supported Python/notebook evaluation-risk patterns without executing source
inputs:
  path:
    description: File or directory to inspect
    required: true
  fail-on:
    description: warning or none
    default: warning
  strict:
    description: Exit nonzero on coverage notes as well as configured findings
    default: 'false'
outputs:
  report-directory:
    description: Directory containing HTML, JSON and SARIF evidence
    value: ${{ steps.scan.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Install local engine
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH/../../.."
    - name: Inspect source without executing it
      id: scan
      shell: bash
      env:
        INPUT_SCAN_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        target="$(mktemp -d "$RUNNER_TEMP/evalcheck-code.XXXXXX")"
        echo "directory=$target" >> "$GITHUB_OUTPUT"
        extra=()
        if [ "$INPUT_STRICT" = "true" ]; then extra+=(--strict); fi
        python -m evalcheck scan "$INPUT_SCAN_PATH" --out "$target" --fail-on "$INPUT_FAIL_ON" "${extra[@]}"
