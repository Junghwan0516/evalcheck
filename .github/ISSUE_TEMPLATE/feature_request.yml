name: Detector or integration request
description: Propose a concrete evaluation check or workflow improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Evaluation problem
      description: Give a minimal example and explain the intended evaluation boundary.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Expected evidence and safe counterexample
      description: What should be flagged, and what similar valid code should remain unflagged?
    validations:
      required: true
