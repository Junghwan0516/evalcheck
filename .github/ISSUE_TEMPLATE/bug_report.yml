name: Bug report
description: A reproducible failure or incorrect finding
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic data and exact command
      description: Include Python/OS versions. Remove private source records.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant audit JSON or error output
