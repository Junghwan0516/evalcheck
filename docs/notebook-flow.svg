<text x="42" y="526" fill="#edf2fa" font-size="15">Same Python engine in the CLI and browser WebAssembly. HTML · JSON · SARIF.</text><text x="42" y="554" fill="#a4b1c5" font-size="12">Included illustrative notebook and verified scanner output. Scoped analysis with explicit abstentions.</text><text x="42" y="580" fill="#69768d" font-size="11">Pre-commit + reusable CI gate included. No finding is not a complete-program leakage certification.</text></g></svg>
