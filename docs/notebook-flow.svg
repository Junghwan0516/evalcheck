<text x="62" y="307" fill="#91b8fb" font-size="12">ORIGIN · CELL 2, LINE 2</text><rect x="57" y="328" width="520" height="48" rx="6" fill="#2c2520"/><text x="71" y="358" fill="#f5ce77" font-family="monospace" font-size="15">Z = scaler.fit_transform(X)</text><text x="62" y="412" fill="#a4b1c5" font-size="13">Fitted preprocessing sees the full cohort.</text><text x="62" y="451" fill="#a4b1c5" font-size="12">The source is parsed as AST, never executed.</text>
